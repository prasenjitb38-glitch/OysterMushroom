{% extends 'base.html' %}{% block body %}<h1>{{ title }}</h1><form method="post" class="form" id="crud-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% for name,label,kind,options in fields %}<label>{{ label }}{% if kind=='select' %}<select name="{{name}}" required>{% for value,text in options %}<option value="{{value}}" {% if values.get(name,'')|string==value|string %}selected{% endif %}>{{text}}</option>{% endfor %}</select>{% else %}<input type="{{kind}}" name="{{name}}" value="{{ values.get(name,'') if kind!='password' else '' }}" {% if kind=='number' %}min="0" step="0.01"{% endif %} {% if name not in ('notes','email','mobile','address','batch_no','expected_harvest_date') %}required{% endif %}>{% endif %}</label>{% endfor %}<div class="calculated"><strong id="calculated-total"></strong><span id="calculated-due"></span></div><button type="submit">💾 Save</button></form><script>const f=document.getElementById('crud-form');function calc(){const q=Number(f.elements.quantity?.value||0),r=Number(f.elements.rate?.value||0),p=Number(f.elements.paid_amount?.value||0),t=q*r;const box=document.getElementById('calculated-total'),due=document.getElementById('calculated-due');if(f.elements.quantity&&f.elements.rate){box.textContent=`Total: ${t.toFixed(2)}`;due.textContent=` Due: ${(t-p).toFixed(2)}`}}f.addEventListener('input',calc);calc()</script>{% endblock %}
