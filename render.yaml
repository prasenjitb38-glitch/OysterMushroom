services:
  - type: web
    name: oyster-mushroom-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: MUSHROOM_DATA_DIR
        value: /var/data
    disk:
      name: mushroom-data
      mountPath: /var/data
      sizeGB: 1
